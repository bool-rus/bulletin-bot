on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check, build release and store
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release
      - uses: actions/upload-artifact@v4
        with: 
          name: bulletin-bot
          path: target/release/bulletin-bot
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: zijiren233/cargo-cross@v1
        with:
          command: build
          targets: x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with: 
          name: bulletin-bot-musl
          path: target/release/bulletin-bot

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
